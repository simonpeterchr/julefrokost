<!doctype html>
<html lang="da" data-base="{{base}}" data-rum="{{rum}}" data-build="{{build}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Julefrokost – storskærm</title>
<link rel="icon" href="{{s}}/ikon.svg">
<link rel="stylesheet" href="{{s}}/fest.css">
<script src="{{s}}/vendor/qrcode.min.js"></script>
</head>
<body>
<canvas id="snow"></canvas>
<div class="tv" id="tv">
  <div id="stage" class="stage"></div>
  <div id="corner" class="corner hidden"><div class="qr" id="qrs"></div><div><b>Deltag på telefonen</b><br><span class="dim" id="url"></span><br>Kode <b class="gold" id="code"></b><br><small class="dim">OK / Enter = menu</small></div></div>
  <div id="hp" class="hiddenplayer"><div id="ytA"></div></div>
  <div id="vid" class="video hidden"><div id="ytB"></div></div>
  <div id="ad" class="ad hidden"></div>
  <div id="hpc" class="hiddenplayer"></div>
  <div id="hpd" class="hiddenplayer"><div id="ytD"></div></div>
  <div id="hps" class="hiddenplayer"><div id="ytS"></div></div>
  <div id="hpp" class="hiddenplayer"><div id="ytP"></div></div>
  <div id="snaps" class="snaps hidden"></div>
  <div id="pina" class="pina hidden"></div>
  <div id="msg" class="msg hidden"></div>
</div>
<div id="start" class="tv start hidden"><div class="startbox">🎄<br>Klik her – eller tryk OK – for at starte storskærmen<br><small class="dim">(så må den spille lyd og fylde hele skærmen)</small></div></div>
<script src="{{s}}/snow.js"></script>
<script src="{{s}}/icons.js"></script>
<script src="{{s}}/tv.js"></script>
</body>
</html>
